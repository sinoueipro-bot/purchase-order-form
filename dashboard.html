<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>アイプロ 統合ダッシュボード</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
      background: #eef1f5; color: #1f2937; font-size: 14px;
    }
    /* ===== ヘッダー ===== */
    .topbar {
      background: #111827; color: #fff; padding: 10px 16px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar .brand { font-weight: 700; font-size: 16px; letter-spacing: .02em; }
    .topbar .brand small { color: #9ca3af; font-weight: 500; margin-left: 8px; font-size: 11px; }
    .topbar .tab {
      background: #e5322d; color: #fff; border-radius: 6px; font-size: 12px;
      padding: 4px 12px; font-weight: 700;
    }
    .topbar .spacer { flex: 1; }
    .topbar .updated { color: #9ca3af; font-size: 11px; }
    .btn-refresh {
      background: #374151; color: #fff; border: 0; border-radius: 6px;
      padding: 6px 14px; font-size: 12px; cursor: pointer;
    }
    .btn-refresh:hover { background: #4b5563; }
    .btn-refresh:disabled { opacity: .5; cursor: default; }

    .wrap { max-width: 1240px; margin: 0 auto; padding: 14px; }

    /* ===== KPI行 ===== */
    .kpis {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 14px;
    }
    .kpi {
      background: #fff; border-radius: 12px; padding: 12px 14px;
      box-shadow: 0 1px 3px rgba(16,24,40,.08); position: relative; overflow: hidden;
    }
    .kpi .label { font-size: 11px; color: #6b7280; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .kpi .num { font-size: 30px; font-weight: 800; line-height: 1.3; }
    .kpi .sub { font-size: 11px; color: #9ca3af; }
    .kpi.alert-kpi { background: #e5322d; color: #fff; }
    .kpi.alert-kpi .label, .kpi.alert-kpi .sub { color: rgba(255,255,255,.85); }
    .kpi .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    /* ===== カードグリッド ===== */
    .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; align-items: start; }
    .col { display: grid; gap: 14px; }
    .card {
      background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(16,24,40,.08);
      padding: 14px 16px;
    }
    .card h2 {
      font-size: 13px; font-weight: 700; color: #111827; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .card h2 .count-badge {
      background: #e5322d; color: #fff; border-radius: 999px; min-width: 20px; height: 20px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; padding: 0 6px; font-weight: 700;
    }
    .muted { color: #9ca3af; font-size: 12px; padding: 10px 0; line-height: 1.7; }
    .errbox { background: #fef2f2; color: #b91c1c; font-size: 12px; border-radius: 8px; padding: 8px 10px; line-height: 1.6; }

    /* チャネルバッジ */
    .ch { color: #fff; border-radius: 4px; font-size: 10px; font-weight: 700; padding: 2px 6px; white-space: nowrap; }
    .ch-lw { background: #00a0a8; }
    .ch-line { background: #06c755; }
    .ch-cw { background: #f0483e; }
    .ch-gm { background: #d93025; }

    /* タイムライン */
    .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .fchip {
      border: 1px solid #d1d5db; background: #fff; color: #374151; border-radius: 999px;
      font-size: 11px; padding: 4px 12px; cursor: pointer; font-weight: 600;
    }
    .fchip.on { background: #111827; color: #fff; border-color: #111827; }
    .tl-item {
      display: flex; gap: 10px; padding: 8px 8px; border-bottom: 1px solid #f3f4f6;
      border-radius: 8px; align-items: flex-start;
    }
    .tl-item.hit { background: #fdecea; }
    .tl-time { color: #9ca3af; font-size: 11px; white-space: nowrap; padding-top: 2px; width: 74px; }
    .tl-body { flex: 1; min-width: 0; }
    .tl-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 2px; }
    .tl-room { color: #6b7280; font-size: 11px; }
    .tl-sender { font-weight: 700; font-size: 12px; }
    .tl-text { font-size: 13px; line-height: 1.55; word-break: break-word; }
    .kwchip {
      background: #e5322d; color: #fff; font-size: 10px; border-radius: 4px;
      padding: 1px 6px; margin-left: 4px; font-weight: 700;
    }

    /* リスト系 */
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 7px 4px; border-bottom: 1px solid #f3f4f6; font-size: 12.5px; align-items: center; }
    .row .l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .r { color: #6b7280; white-space: nowrap; font-size: 11.5px; }
    .pill { border-radius: 999px; font-size: 10.5px; padding: 2px 8px; font-weight: 700; white-space: nowrap; }
    .pill-red { background: #fee2e2; color: #b91c1c; }
    .pill-green { background: #dcfce7; color: #15803d; }
    .pill-gray { background: #f3f4f6; color: #4b5563; }
    .pill-blue { background: #dbeafe; color: #1d4ed8; }

    .mini-stats { display: flex; gap: 10px; margin-bottom: 8px; }
    .mini-stat { flex: 1; background: #f9fafb; border-radius: 8px; padding: 8px; text-align: center; }
    .mini-stat .n { font-size: 20px; font-weight: 800; }
    .mini-stat .t { font-size: 10.5px; color: #6b7280; }
    .mini-stat.warn .n { color: #e5322d; }

    table.ads { border-collapse: collapse; width: 100%; font-size: 11.5px; }
    table.ads th, table.ads td { border-bottom: 1px solid #f3f4f6; padding: 5px 6px; text-align: right; white-space: nowrap; }
    table.ads th:first-child, table.ads td:first-child { text-align: left; }
    table.ads th { color: #6b7280; font-weight: 600; background: #f9fafb; }
    .ads-scroll { overflow-x: auto; }

    /* 接続状態フッター */
    .conn { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-bottom: 30px; }
    .conn .c { background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 11px; color: #374151; box-shadow: 0 1px 2px rgba(16,24,40,.06); }
    .conn .ok::before { content: '● '; color: #16a34a; }
    .conn .ng::before { content: '● '; color: #d1d5db; }
    .conn .warn::before { content: '● '; color: #f59e0b; }

    #loading {
      position: fixed; inset: 0; background: rgba(238,241,245,.9); z-index: 50;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
      color: #6b7280; font-size: 13px;
    }
    .spinner { width: 34px; height: 34px; border: 4px solid #d1d5db; border-top-color: #e5322d; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #topError { display: none; margin-bottom: 12px; }

    @media (max-width: 960px) {
      .grid { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .kpi .num { font-size: 24px; }
      .tl-time { width: 60px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="brand">営業AIデスク<small>アイプロ 統合ダッシュボード</small></span>
    <span class="tab">ダッシュボード</span>
    <span class="spacer"></span>
    <span class="updated" id="updated">読み込み中…</span>
    <button class="btn-refresh" id="btnRefresh" onclick="load(true)">更新</button>
  </div>

  <div class="wrap">
    <div class="errbox" id="topError"></div>

    <!-- KPI -->
    <div class="kpis">
      <div class="kpi"><div class="label"><span class="dot" style="background:#00a0a8"></span>LINE WORKS</div><div class="num" id="kpiLw">–</div><div class="sub">本日の受信</div></div>
      <div class="kpi"><div class="label"><span class="dot" style="background:#06c755"></span>LINE</div><div class="num" id="kpiLine">–</div><div class="sub">本日の受信</div></div>
      <div class="kpi"><div class="label"><span class="dot" style="background:#f0483e"></span>Chatwork</div><div class="num" id="kpiCw">–</div><div class="sub" id="kpiCwSub">未読</div></div>
      <div class="kpi"><div class="label"><span class="dot" style="background:#d93025"></span>メール</div><div class="num" id="kpiGm">–</div><div class="sub" id="kpiGmSub">未読</div></div>
      <div class="kpi alert-kpi"><div class="label">⚠ 要対応</div><div class="num" id="kpiAlert">–</div><div class="sub">直近48時間のキーワード検知</div></div>
    </div>

    <div class="grid">
      <!-- 左カラム: タイムライン -->
      <div class="col">
        <div class="card" id="alertCard" style="display:none">
          <h2>⚠ 要対応メッセージ <span class="count-badge" id="alertCount">0</span></h2>
          <div id="alertList"></div>
        </div>

        <div class="card">
          <h2>統合受信タイムライン（LINE WORKS / LINE）</h2>
          <div class="filters">
            <button class="fchip on" data-f="all" onclick="setFilter('all', this)">すべて</button>
            <button class="fchip" data-f="LINE WORKS" onclick="setFilter('LINE WORKS', this)">LINE WORKS</button>
            <button class="fchip" data-f="LINE" onclick="setFilter('LINE', this)">LINE</button>
          </div>
          <div id="timeline"><div class="muted">読み込み中…</div></div>
        </div>
      </div>

      <!-- 右カラム: 各ソース -->
      <div class="col">
        <div class="card">
          <h2>📦 発注システム</h2>
          <div class="mini-stats">
            <div class="mini-stat warn"><div class="n" id="odPending">–</div><div class="t">承認待ち</div></div>
            <div class="mini-stat"><div class="n" id="odToday">–</div><div class="t">本日の申請</div></div>
            <div class="mini-stat"><div class="n" id="odStock">–</div><div class="t">入庫待ち明細</div></div>
          </div>
          <div id="odRecent"></div>
        </div>

        <div class="card">
          <h2><span class="ch ch-cw">Chatwork</span> 未読状況</h2>
          <div id="cwBody"><div class="muted">読み込み中…</div></div>
        </div>

        <div class="card">
          <h2><span class="ch ch-gm">Gmail</span> 受信トレイ</h2>
          <div id="gmBody"><div class="muted">読み込み中…</div></div>
        </div>

        <div class="card">
          <h2>📈 広告サマリー</h2>
          <div id="adsBody"><div class="muted">読み込み中…</div></div>
        </div>
      </div>
    </div>

    <div class="conn" id="connBar"></div>
  </div>

  <div id="loading"><div class="spinner"></div><div>データを集計しています…</div></div>

  <script>
    var DASH_KEY = <?!= JSON.stringify(dashKey) ?>;
    var lastData = null;
    var curFilter = 'all';
    var firstLoad = true;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function num(n) { return (typeof n === 'number' && isFinite(n)) ? n.toLocaleString() : (n || 0); }

    function load(manual) {
      var btn = document.getElementById('btnRefresh');
      btn.disabled = true; btn.textContent = '更新中…';
      google.script.run
        .withSuccessHandler(onData)
        .withFailureHandler(onFail)
        .getDashboardData(DASH_KEY);
    }

    function onFail(err) {
      finishLoading();
      showTopError('データ取得に失敗しました: ' + esc(err && err.message ? err.message : err));
    }

    function showTopError(html) {
      var el = document.getElementById('topError');
      el.innerHTML = html; el.style.display = 'block';
    }

    function finishLoading() {
      var btn = document.getElementById('btnRefresh');
      btn.disabled = false; btn.textContent = '更新';
      if (firstLoad) { document.getElementById('loading').style.display = 'none'; firstLoad = false; }
    }

    function onData(d) {
      finishLoading();
      if (!d || d.error) { showTopError(esc(d && d.error || '不明なエラー')); return; }
      document.getElementById('topError').style.display = 'none';
      lastData = d;
      document.getElementById('updated').textContent = '最終更新 ' + d.now + '（60秒ごと自動更新）';

      // ---- KPI ----
      var inb = d.inbound || { lw: {}, line: {}, alerts: [], recent: [] };
      document.getElementById('kpiLw').textContent = num(inb.lw.today);
      document.getElementById('kpiLine').textContent = num(inb.line.today);
      document.getElementById('kpiAlert').textContent = num((inb.alerts || []).length);

      var cw = d.chatwork || {};
      if (!cw.configured) {
        document.getElementById('kpiCw').textContent = '–';
        document.getElementById('kpiCwSub').textContent = '未設定';
      } else if (cw.error) {
        document.getElementById('kpiCw').textContent = '!';
        document.getElementById('kpiCwSub').textContent = 'エラー';
      } else {
        document.getElementById('kpiCw').textContent = num(cw.unread);
        document.getElementById('kpiCwSub').textContent = '未読（メンション ' + num(cw.mention) + '）';
      }

      var gm = d.gmail || {};
      if (gm.configured) {
        document.getElementById('kpiGm').textContent = num(gm.unread) + (gm.unreadCap ? '+' : '');
        document.getElementById('kpiGmSub').textContent = '未読（本日 ' + num(gm.today) + (gm.todayCap ? '+' : '') + '件受信）';
      } else {
        document.getElementById('kpiGm').textContent = '–';
        document.getElementById('kpiGmSub').textContent = '要再認証';
      }

      renderAlerts(inb.alerts || []);
      renderTimeline();
      renderOrders(d.orders || {});
      renderChatwork(cw);
      renderGmail(gm);
      renderAds(d.ads || {});
      renderConn(d);
    }

    // ---- 要対応 ----
    function renderAlerts(alerts) {
      var card = document.getElementById('alertCard');
      if (!alerts.length) { card.style.display = 'none'; return; }
      card.style.display = 'block';
      document.getElementById('alertCount').textContent = alerts.length;
      document.getElementById('alertList').innerHTML = alerts.map(function (a) { return tlItemHtml(a, true); }).join('');
    }

    // ---- タイムライン ----
    function setFilter(f, el) {
      curFilter = f;
      var chips = document.querySelectorAll('.fchip');
      for (var i = 0; i < chips.length; i++) chips[i].classList.remove('on');
      el.classList.add('on');
      renderTimeline();
    }

    function chBadge(channel) {
      var cls = channel === 'LINE WORKS' ? 'ch-lw' : channel === 'LINE' ? 'ch-line' : 'ch-cw';
      return '<span class="ch ' + cls + '">' + esc(channel) + '</span>';
    }

    function tlItemHtml(r, forceHit) {
      var kwHtml = '';
      if (r.kw) {
        kwHtml = r.kw.split(',').map(function (k) { return '<span class="kwchip">' + esc(k) + '</span>'; }).join('');
      }
      return '<div class="tl-item' + ((r.kw || forceHit) ? ' hit' : '') + '">' +
        '<div class="tl-time">' + esc(r.time) + '</div>' +
        '<div class="tl-body">' +
          '<div class="tl-meta">' + chBadge(r.channel) +
            '<span class="tl-sender">' + esc(r.sender || '不明') + '</span>' +
            '<span class="tl-room">' + esc(r.room || '') + '</span>' + kwHtml +
          '</div>' +
          '<div class="tl-text">' + esc(r.text) + '</div>' +
        '</div></div>';
    }

    function renderTimeline() {
      var el = document.getElementById('timeline');
      if (!lastData) return;
      var recent = (lastData.inbound && lastData.inbound.recent) || [];
      var rows = recent.filter(function (r) { return curFilter === 'all' || r.channel === curFilter; });
      if (!rows.length) {
        var total = (lastData.inbound.lw.total || 0) + (lastData.inbound.line.total || 0);
        el.innerHTML = '<div class="muted">' + (total === 0
          ? 'まだ受信がありません。<br>LINE WORKSのBotをトークルームに招待し、メッセージを送ると（招待以降のメッセージから）ここに流れてきます。<br>設定手順: docs/ダッシュボード_LINE_LINEWORKS連携.md'
          : '該当するメッセージがありません') + '</div>';
        return;
      }
      el.innerHTML = rows.map(function (r) { return tlItemHtml(r, false); }).join('');
    }

    // ---- 発注システム ----
    function statusPill(st) {
      if (st === '申請中') return '<span class="pill pill-red">申請中</span>';
      if (st === '承認済') return '<span class="pill pill-green">承認済</span>';
      if (st === '発注済') return '<span class="pill pill-blue">発注済</span>';
      return '<span class="pill pill-gray">' + esc(st || '-') + '</span>';
    }
    function renderOrders(od) {
      document.getElementById('odPending').textContent = num(od.pending);
      document.getElementById('odToday').textContent = num(od.today);
      document.getElementById('odStock').textContent = num(od.stockAwaiting);
      var el = document.getElementById('odRecent');
      var rec = od.recent || [];
      if (od.error) { el.innerHTML = '<div class="errbox">' + esc(od.error) + '</div>'; return; }
      if (!rec.length) { el.innerHTML = '<div class="muted">発注データがありません</div>'; return; }
      el.innerHTML = rec.map(function (o) {
        return '<div class="row"><span class="l">' + esc(o.orderNo) + ' ' + esc(o.supplier) +
          '（' + esc(o.orderer) + '）</span><span class="r">¥' + num(o.total) + ' ' + statusPill(o.status) + '</span></div>';
      }).join('');
    }

    // ---- Chatwork ----
    function renderChatwork(cw) {
      var el = document.getElementById('cwBody');
      if (!cw.configured) {
        el.innerHTML = '<div class="muted">未設定です。スクリプトプロパティに <b>CHATWORK_API_TOKEN</b> を登録すると未読・メンションが表示されます（手順書 Step 4）</div>';
        return;
      }
      if (cw.error) { el.innerHTML = '<div class="errbox">' + esc(cw.error) + '</div>'; return; }
      var html = '<div class="mini-stats">' +
        '<div class="mini-stat warn"><div class="n">' + num(cw.mention) + '</div><div class="t">TO/返信</div></div>' +
        '<div class="mini-stat"><div class="n">' + num(cw.unread) + '</div><div class="t">未読</div></div>' +
        '<div class="mini-stat"><div class="n">' + num(cw.myTasks) + '</div><div class="t">マイタスク</div></div></div>';
      var rooms = cw.rooms || [];
      if (rooms.length) {
        html += rooms.map(function (r) {
          return '<div class="row"><span class="l">' + esc(r.name) + '</span><span class="r">' +
            (r.mention ? '<span class="pill pill-red">TO ' + num(r.mention) + '</span> ' : '') +
            '未読 ' + num(r.unread) + '</span></div>';
        }).join('');
      } else {
        html += '<div class="muted">未読のルームはありません 🎉</div>';
      }
      el.innerHTML = html;
    }

    // ---- Gmail ----
    function renderGmail(gm) {
      var el = document.getElementById('gmBody');
      if (!gm.configured) {
        el.innerHTML = '<div class="errbox">' + esc(gm.error || 'Gmailを読み込めません') + '</div>';
        return;
      }
      var latest = gm.latest || [];
      if (!latest.length) { el.innerHTML = '<div class="muted">受信トレイにメールがありません</div>'; return; }
      el.innerHTML = latest.map(function (m) {
        return '<div class="row"><span class="l">' + (m.unread ? '<b>' : '') + esc(m.subject) + (m.unread ? '</b>' : '') +
          ' <span style="color:#9ca3af">' + esc(m.from) + '</span></span><span class="r">' + esc(m.time) + '</span></div>';
      }).join('');
    }

    // ---- 広告 ----
    function renderAds(ads) {
      var el = document.getElementById('adsBody');
      if (!ads.configured) {
        el.innerHTML = '<div class="muted">未設定（任意）です。スクリプトプロパティに <b>ADS_SPREADSHEET_ID</b>（＋必要なら ADS_SHEET_NAME）を登録すると、広告実績シートの直近5行をここに表示します（手順書 Step 5）</div>';
        return;
      }
      if (ads.error) { el.innerHTML = '<div class="errbox">' + esc(ads.error) + '</div>'; return; }
      if (!ads.rows || !ads.rows.length) { el.innerHTML = '<div class="muted">データがありません（' + esc(ads.title) + '）</div>'; return; }
      var html = '<div class="muted" style="padding:0 0 6px">' + esc(ads.title) + '（直近' + ads.rows.length + '行）</div><div class="ads-scroll"><table class="ads"><tr>';
      html += ads.headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('');
      html += '</tr>';
      html += ads.rows.map(function (row) {
        return '<tr>' + row.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
      }).join('');
      html += '</table></div>';
      el.innerHTML = html;
    }

    // ---- 接続状態 ----
    function renderConn(d) {
      var inb = d.inbound;
      var items = [
        { name: 'LINE WORKS', cls: inb.lw.total > 0 ? 'ok' : 'warn', note: inb.lw.total > 0 ? '受信 ' + num(inb.lw.total) + '件' : 'Bot招待待ち' },
        { name: 'LINE', cls: inb.line.total > 0 ? 'ok' : 'warn', note: inb.line.total > 0 ? '受信 ' + num(inb.line.total) + '件' : 'Webhook設定待ち' },
        { name: 'Chatwork', cls: d.chatwork.configured && !d.chatwork.error ? 'ok' : 'ng', note: d.chatwork.configured ? (d.chatwork.error ? 'エラー' : '接続中') : '未設定' },
        { name: 'Gmail', cls: d.gmail.configured ? 'ok' : 'ng', note: d.gmail.configured ? '接続中' : '要再認証' },
        { name: '広告', cls: d.ads.configured && !d.ads.error ? 'ok' : 'ng', note: d.ads.configured ? (d.ads.error ? 'エラー' : '接続中') : '未設定(任意)' },
        { name: 'LINE名前解決', cls: d.lineTokenSet ? 'ok' : 'ng', note: d.lineTokenSet ? '有効' : 'トークン未設定(任意)' }
      ];
      document.getElementById('connBar').innerHTML = items.map(function (it) {
        return '<span class="c ' + it.cls + '">' + esc(it.name) + '：' + esc(it.note) + '</span>';
      }).join('');
    }

    load();
    setInterval(function () { load(false); }, 60000);
  </script>
</body>
</html>
